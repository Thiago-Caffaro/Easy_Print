name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    name: Create source release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate release metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$(git describe --exact-match --tags HEAD)" = "$RELEASE_TAG"
          grep --fixed-strings --quiet "## [Unreleased]" CHANGELOG.md

      - name: Create source archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: git archive --format=tar.gz --prefix="easy-print-${RELEASE_TAG#v}/" --output "$RUNNER_TEMP/easy-print-${RELEASE_TAG}.tar.gz" "$RELEASE_TAG"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" "$RUNNER_TEMP/easy-print-${RELEASE_TAG}.tar.gz" --generate-notes --title "Easy Print ${RELEASE_TAG}"
