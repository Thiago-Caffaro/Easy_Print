name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none
          extensions: intl, pdo_sqlite
          tools: composer:2.10.2@sha256:5ee7125f8a30a34d246cefdc0bc85b8a783b28f2aec968994118512350d28027
        env:
          fail-fast: true

      - name: Resolve Composer cache directory
        id: composer-cache
        run: echo "directory=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.directory }}
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --strict-psr-autoloader

      - name: Audit dependencies
        run: composer audit --locked

      - name: Check formatting
        run: composer format:check

      - name: Run static analysis
        run: composer analyse

      - name: Run tests
        run: composer test

      - name: Validate Compose model
        run: docker compose config --quiet

  markdown:
    name: Markdown
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.23.2

  containers:
    name: Containers
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Validate Compose model
        run: docker compose config --quiet

      - name: Build reference images
        run: docker compose build --pull web cups

      - name: Start the empty CUPS reference service
        run: docker compose up --detach --wait cups

      - name: Smoke test queue discovery from the web image
        run: docker compose run --rm --no-deps web php /app/bin/check-cups.php

      - name: Clean up reference services
        if: always()
        run: docker compose down --volumes --remove-orphans
